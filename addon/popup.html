<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container header">
      <p class="title">CEA Assistant</p>
      <p class="subtitle">V 0.1</p>
    </div>

    <div class="line"></div>

    <div class="container tabButtonContainer">
      <div class="tabButton active" id="rollTabButton">Roll</div>
      <div class="tabButton disabled" id="rampTabButton">RAMP</div>
    </div>

    <div class="container tabBodyContainer" id="rollTabBody">
      <div class="tabBodyHeader">
        <div class="textContainer">
          <p>MODULE</p>
          <p class="title">ROLL_MARKER</p>
        </div>
        <div class="activeIndicator green"></div>
      </div>
      <div class="dropdownContainer">
        <p>KEY</p>
        <select name="key" id="rollKeySelector">
          <option value="id">CEA ID</option>
          <option value="name">Name</option>
          <option value="name_lastfirst">Name (Last,First)</option>
        </select>
      </div>
      <div class="fileInputZone">
        <input type="file" accept=".csv" id="fileUpload" class="hidden" />
        <p class="title">Click to select source file</p>
        <p class="subtitle">SUPPORTED: .csv</p>
      </div>
      <div class="actionButton" id="markRollActionButton">Mark Roll</div>
    </div>

    <div class="container tabBodyContainer hidden" id="rampTabBody">
      <div class="tabBodyHeader">
        <div class="textContainer">
          <p>MODULE</p>
          <p class="title">RAMP_COPY</p>
        </div>
        <div class="activeIndicator green"></div>
      </div>
      <div class="subContainer">
        <p>ACTIVITY ID</p>
        <p class="title" id="activityIdDisplay">12345</p>
      </div>
      <div class="actionButton" id="copyRampActionButton">Copy Ramp</div>
      <div class="actionButton" id="pasteRampActionButton">Paste Ramp</div>
    </div>

    <div class="container notification hidden">
      <div class="notificationScanLine"></div>
      <div class="notificationContainer">
        <div class="activeIndicator"></div>
        <p>Notification text is here</p>
      </div>
    </div>

    <script src="popup.js"></script>
    <script src="roll.js"></script>
    <script src="ramp.js"></script>
  </body>
</html>
